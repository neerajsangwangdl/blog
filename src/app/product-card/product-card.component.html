<div class="card h-100 shadow-lg">
  <img src=" " class="card-img-top" alt="{{ product.Name }}">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.Name }}</h5>
    <p class="card-text">{{ product.Description }}</p>
    <p class="card-text">Price: &#8377; {{ product.Price}} / Piece</p>
  </div>
  <div>
      <span class="badge bg-secondary " > COD Available</span> &nbsp;
      <span class="badge bg-secondary"  > stock: {{product.stock}}</span> &nbsp;
    <a href="#" class="btn btn-primary mt-auto">Buy Now</a>
  </div>
</div>
